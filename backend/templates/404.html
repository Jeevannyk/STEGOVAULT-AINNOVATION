<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>404 — Not Found</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0b0f;
      color: #e7e7ea;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .page_404 {
      max-width: 480px;
      width: 100%;
    }

    /* Big heading */
    .four_zero_four_bg h3 {
      font-size: 80px;
      margin: 0;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #39ac31, #9be78f);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Pull content box up for vertical centering */
    .contant_box_404 {
      margin-top: -20px;
    }

    .contant_box_404 h3 {
      font-size: 22px;
      margin: 0 0 8px;
      color: #f4f4f6;
    }

    .contant_box_404 p {
      margin: 0 0 4px;
      color: #9a9aa3;
      font-size: 14px;
    }

    /* "Go Home" button */
    .link_404 {
      color: #fff !important;
      padding: 10px 20px;
      background: #39ac31;
      margin: 20px 0;
      display: inline-block;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    .link_404:hover { background: #2f9329; }
  </style>
</head>
<body>
  <div class="page_404">
    <div class="four_zero_four_bg">
      <h3>404</h3>
    </div>
    <div class="contant_box_404">
      <h3>Looks like you're lost</h3>
      <p>The page you are looking for is not available.</p>
      <a href="/" class="link_404">Go to Home</a>
    </div>
  </div>
</body>
</html>
